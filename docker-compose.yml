services:
  proxy:
    image: itzg/mc-proxy:latest
    ports:
      - "25565:25565"
      - "25568:25568"
      - "24454:24454/udp"
    environment:
      TYPE: VELOCITY
      MINECRAFT_VERSION: 1.21.10
      SKIP_DOWNLOAD_DEFAULTS: "true"
      JVM_OPTS: "-Dvelocity.packet-decode-logging=true -Dvelocity.max-plugin-message-payload-size=5242880"
    volumes:
      - ./velocity_data:/server
      - ./config:/config
    networks:
      - katcraft_net
    depends_on:
      - katcraftpanel
    restart: unless-stopped

  katcraftpanel:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: katcraftpanel
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./servers:/app/servers
      - ./velocity_data:/app/velocity_data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets/backup_deploy_key:/root/.ssh/id_ed25519:ro
      - ./secrets/ssh_known_hosts:/root/.ssh/known_hosts:ro
    networks:
      - katcraft_net
      - traefik_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.katcraftpanel.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.katcraftpanel.loadbalancer.server.port=3000"

networks:
  katcraft_net:
    name: katcraft_net
  traefik_default:
    external: true
